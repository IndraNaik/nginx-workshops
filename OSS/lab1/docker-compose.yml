version: '3.3'
services:
  nginx-oss:                  # NGINX OSS Webserver
    hostname: indra-nginx-oss
    container_name: indra-nginx-oss
    build: nginx-oss          # Build new container, using /nginx-oss/Dockerfile
    volumes:
        - ./indra-nginx-oss/etc/nginx/conf.d/stub_status.conf:/etc/nginx/conf.d/stub_status.conf            # Copy this file to container
    ports:
        - 80:80       # Open for HTTP
        - 443:443     # Open for HTTPS
        - 9000:9000   # Open for stub status page
    restart: always     